- title: 研究兴趣
  type: nested_list
  contents:
    - title: 城市时空大数据挖掘与可持续发展
      items:
        - 通过挖掘城市时空大数据揭示城市发展模式与趋势
        - 为城市规划和决策提供科学依据
        - 实现城市可持续发展和智能化建设
    - title: 建成环境与人类活动、社会经济属性相互作用机制探索
      items:
        - 分析建成环境与人类活动、社会经济属性的关联关系
        - 探索城市建成环境对人类活动和社会经济的影响及其相互作用机制
        - 提升资源利用效率，为城市可持续发展提供科学依据
    - title: 地理智能算法与应用
      items:
        - 以大语言模型（LLM）赋能时空大数据，增强多模态地理信息的深度认知与智能处理
        - 探索基于地理智能体（GeoAgent）的复杂系统建模方法，解决多目标约束下的资源配置和城市问题
        - 建立新一代GeoAI技术体系，实现城市管理从数字化向智能化、自主化的跨越

