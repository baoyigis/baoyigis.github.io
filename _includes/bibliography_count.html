<div class="publications">
  {% for group in site.data.papers.biblio %}
  <h2 class="year">{{ group[0] }} <span class="badge">{{ group[1] | size }}</span></h2>
  {% for entry in group[1] %}
  <div class="row">
    <div id="{{ entry.key }}" class="col-sm-12">{% include bib.liquid entry=entry %}</div>
  </div>
  {% endfor %} {% endfor %}
</div>
